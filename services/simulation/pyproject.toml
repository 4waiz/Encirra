[project]
name = "encirra-sim"
version = "0.1.0"
description = "Encirra simulation service: coupled pandapower (IEEE 33-bus) + WNTR hydraulic co-simulation, recovery planning and independent verification."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "pandapower>=3.1",
  "wntr>=1.3",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "ortools>=9.10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "numba>=0.68.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["encirra_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
  "ignore::FutureWarning",
  "ignore:Bitwise inversion:DeprecationWarning",
]
